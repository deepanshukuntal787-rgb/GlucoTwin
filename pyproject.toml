[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gluco-twin"
version = "1.0.0"
description = "GlucoTwin: Probabilistic Physiological Digital Twin for Hyperglycemia Alerting & Counterfactual Simulation"
authors = [{ name = "GlucoTwin Team" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "joblib>=1.3.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gluco_twin*"]
